<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salary Details Fetcher</title>
    <style>
        :root{
            --bg:#f3f7fb;
            --card:#ffffff;
            --accent:#6c5ce7;
            --muted:#6b7280;
            --success:#10b981;
        }
        body{
            margin:0;
            font-family:Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            background: linear-gradient(180deg, #eef2ff 0%, var(--bg) 100%);
            display:flex;
            min-height:100vh;
            align-items:center;
            justify-content:center;
            padding:32px;
            color:#0f172a;
        }
        .wrapper{
            width:100%;
            max-width:820px;
        }
        .uploader{
            display:flex;
            gap:12px;
            align-items:center;
            margin-bottom:18px;
        }
        input[type=file]{
            background:transparent;
        }
        button{
            background:linear-gradient(90deg,var(--accent),#5b8def);
            color:white;
            border:0;
            padding:10px 14px;
            border-radius:10px;
            cursor:pointer;
            box-shadow:0 6px 18px rgba(108,92,231,0.18);
            font-weight:600;
        }
        .card{
            background:var(--card);
            border-radius:14px;
            padding:22px;
            box-shadow:0 8px 30px rgba(15,23,42,0.06);
            display:flex;
            gap:18px;
            align-items:center;
        }
        .card .left{
            flex:1;
        }
        .card .title{
            font-size:18px;
            font-weight:700;
            color:#0f172a;
            display:flex;
            gap:10px;
            align-items:center;
        }
        .card .subtitle{ color:var(--muted); font-size:13px; margin-top:6px }
        .amounts{ display:flex; gap:12px; margin-top:14px; flex-wrap:wrap }
        .amount{
            background:linear-gradient(180deg, rgba(99,102,241,0.06), rgba(99,102,241,0.02));
            border-radius:10px;
            padding:12px 14px;
            min-width:150px;
        }
        .amount .label{ font-size:12px; color:var(--muted) }
        .amount .value{ font-size:16px; font-weight:700; margin-top:6px }
        .net-badge{ background: linear-gradient(90deg,#fef08a,#fca5a5); padding:6px 10px; border-radius:999px; font-weight:700 }
        .processing{ color:var(--muted); font-style:italic }
        .error{
            color:#b91c1c;
            background:rgba(185,28,28,0.04);
            padding:10px 12px;
            border-radius:8px;
        }
        @media (max-width:520px){
            .amounts{ flex-direction:column }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="uploader">
            <input type="file" id="pdfUpload" accept=".pdf">
            <button onclick="uploadFile()">Get Salary Details</button>
        </div>

        <div id="result">
            <!-- Rendered salary card will appear here -->
        </div>
    </div>

    <script src="scripts/salarycard.js"></script>
</body>
</html>
